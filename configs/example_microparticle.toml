# EXAMPLE values only (2026-10-06): a charged polystyrene-like microsphere in air.
# They are NOT taken from the experiment or the prior notebooks; replace them
# with real parameters before drawing physical conclusions.
# Conventions: docs/simulation/model.md (SI units, March voltage convention,
# ideal ring-endcap trap with r0^2 = 2 z0^2, gravity along -z).

[particle]
radius = 5.0e-6          # m
density = 1050.0         # kg/m^3
charge = 1.6e-14         # C, signed (about 1e5 e)

[gas]
viscosity = 1.81e-5      # Pa s (air, 20 C); Stokes drag k = 6 pi eta R

[trap]
r0 = 5.0e-3              # m, ring inner radius; z0 = r0 / sqrt(2)
v_dc = 0.0               # V, ring minus endcap
v_ac = 1000.0            # V, amplitude (not peak-to-peak)
frequency = 200.0        # Hz; Omega = 2 pi f
rf_phase = 0.0           # rad; voltage V_DC + V_AC cos(Omega t + rf_phase)
gravity = 9.80665        # m/s^2 along -z

[simulation]
duration = 0.15          # s (30 RF periods)
# Each particle: position [m] and physical velocity [m/s] at t = 0.
# One particle keeps the animation readable; add more [[particles]] blocks if needed.
[[particles]]
label = "particle"
position = [2.0e-3, 1.0e-3, 1.5e-3]
velocity = [-0.5, 1.2, 0.5]

# Monte Carlo capture-probability scan (scripts/capture_map.py, Phase 5).
# The spreads below are EXAMPLE values, not measured injection conditions.
[capture]
v_dc_range = [-1000.0, 1000.0]   # V
n_v_dc = 41
v_ac_range = [0.0, 6000.0]       # V, amplitude
n_v_ac = 61
samples = 300                    # per grid point
seed = 1
rf_periods = 200                 # observation time in RF periods
steps_per_rf = 200
rf_phase = "uniform:0:6.283185307179586"
pos_center = [0.0, 0.0, 0.0]     # m
pos_radius = 1.0e-3              # m, uniform in a sphere
vel_mean = [0.0, 0.0, 0.0]       # m/s
vel_sigma = 0.5                  # m/s, per component
